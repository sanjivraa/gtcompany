<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1626"/>
      <stop offset="100%" stop-color="#050A14"/>
    </linearGradient>
    <linearGradient id="letter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#1A8FFF"/>
    </linearGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B00" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#1A8FFF" stop-opacity="0.5"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Border -->
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="url(#border)" stroke-width="1.5"/>
  <!-- Inner highlight -->
  <rect x="2" y="2" width="60" height="22" rx="12" fill="rgba(255,255,255,0.04)"/>
  <!-- G letter -->
  <text x="32" y="46" text-anchor="middle" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="44" fill="url(#letter)" letter-spacing="-3">G</text>
</svg>
